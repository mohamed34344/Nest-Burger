<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <script src="./checkout.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>Checkout</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        /* background: linear-gradient(135deg, #db871f, #000000bf); */

        background: linear-gradient(-45deg, #ffffff, #ffa010, #e38112);
      }

      .container {
        max-width: 1100px;
        margin: auto;
        padding: 30px 20px;
      }

      .checkout {
        display: flex;
        gap: 25px;
        flex-wrap: wrap;
      }

      .box {
        background: #ffffff;
        padding: 25px;
        border-radius: 16px;
        flex: 1;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        transition: 0.3s;
      }

      .box:hover {
        transform: translateY(-3px);
      }

      h2 {
        margin-bottom: 15px;
        color: #1d1d1d;
      }

      h3 {
        margin-top: 20px;
        margin-bottom: 10px;
        color: #444;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border-radius: 10px;
        border: 1px solid #ddd;
        transition: 0.3s;
      }

      input:focus {
        border-color: #ff6600;
        outline: none;
        box-shadow: 0 0 5px rgba(255, 102, 0, 0.3);
      }

      .row {
        display: flex;
        gap: 10px;
      }

      /* PAYMENT */
      .method-card {
        display: block;
        border: 1px solid #eee;
        border-radius: 14px;
        padding: 15px;
        margin-top: 12px;
        cursor: pointer;
        transition: 0.3s;
        background: #fafafa;
      }

      .method-card:hover {
        border-color: #ff6600;
        background: #fff3e6;
      }

      .method-card.active {
        border: 2px solid #ff6600;
        background: #fff3e6;
      }

      .method-header {
        font-weight: bold;
        font-size: 16px;
      }

      .method-form {
        max-height: 0;
        overflow: hidden;
        transition: 0.4s;
      }

      .method-card.active .method-form {
        max-height: 200px;
        margin-top: 10px;
      }

      /* ORDER */
      .order-item {
        display: flex;
        justify-content: space-between;
        margin: 12px 0;
        font-size: 15px;
      }

      hr {
        margin: 20px 0;
        border: none;
        height: 1px;
        background: #eee;
      }

      /* TOTAL */
      h3 span {
        color: #d62828;
      }

      /* BUTTON */
      .button__place {
        width: 100%;
        padding: 14px;
        margin-top: 25px;
        background: linear-gradient(135deg, #ff6600, #ff8c42);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .button__place:hover {
        transform: scale(1.03);
        box-shadow: 0 8px 20px rgba(255, 102, 0, 0.4);
      }

      /* RESPONSIVE */
      @media (max-width: 768px) {
        .checkout {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <header class="header">
      <div class="logoContent">
        <img class="logo" src="image/NESTO (1).png" alt="logo website" />
      </div>
      <div class="links">
        <a class="links__link" href="index.html">Home</a>
        <a class="links__link" href="menu.html">Menu</a>
        <a class="links__link" href="About.html">About</a>
        <a class="links__link" href="Contact.html">Contact US</a>

        <div class="cart-icon" onclick="goToCart()">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cartCount">0</span>
        </div>

        <button class="signin-btn" onclick="goToLogin()">Sign In</button>

        <script>
          function goToLogin() {
            window.location.href = "login.html";
          }
        </script>
      </div>
    </header>
    <div class="container">
      <div class="checkout">
        <!-- LEFT -->
        <div class="box">
          <form id="checkoutForm">
            <h2>Checkout</h2>

            <h3>Customer Info</h3>
            <input type="text" placeholder="Full Name" required />
            <input type="text" placeholder="Phone Number" required />
            <input type="text" placeholder="Address" required />

            <h3>Payment Method</h3>

            <!-- CARD -->
            <label class="method-card">
              <input
                type="radio"
                name="payment"
                value="card"
                onchange="selectMethod('card')"
              />
              <div class="method-header">💳 Credit Card</div>

              <div class="method-form">
                <input type="text" placeholder="Card Number" />
                <div class="row">
                  <input type="text" placeholder="MM/YY" />
                  <input type="text" placeholder="CVV" />
                </div>
              </div>
            </label>

            <!-- VODAFONE -->
            <label class="method-card">
              <input
                type="radio"
                name="payment"
                value="vodafone"
                onchange="selectMethod('vodafone')"
              />
              <div class="method-header">📱 Vodafone Cash</div>

              <div class="method-form">
                <input type="text" placeholder="Phone Number" />
                <input type="text" placeholder="Transaction Code" />
              </div>
            </label>

            <!-- CASH -->
            <label class="method-card">
              <input
                type="radio"
                name="payment"
                value="cash"
                onchange="selectMethod('cash')"
              />
              <div class="method-header">💵 Cash on Delivery</div>

              <div class="method-form">
                <p>Pay when your order arrives 🚚</p>
              </div>
            </label>

            <button class="button__place" type="submit">Place Order</button>
          </form>
        </div>

        <!-- RIGHT (ORDER SUMMARY) -->
        <div class="box">
          <h2>Your Order</h2>

          <div id="summaryItems"></div>

          <hr />

          <p>Subtotal: <span id="subtotal">0</span> LE</p>
          <p>Delivery: <span id="delivery">0</span> LE</p>
          <h3>Total: <span id="total">0</span> LE</h3>
        </div>
      </div>
    </div>
  </body>
</html>
