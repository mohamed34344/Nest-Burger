<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nest Burger</title>
 <link rel="icon" type="image/x-icon" href="favicon_io (1)/favicon.ico" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css" />
  </head>

  <body>

    <div class="container">
      <header class="header">
        <div class="logoContent">
          <img class="logo" src="image/NESTO (1).png" alt="logo website" />
        </div>
      
        <div class="links" id="navLinks">
          <a class="links__link" href="index.html">Home</a>
          <a class="links__link" href="menu.html">Menu</a>
          <a class="links__link" href="About.html">About</a>
          <a class="links__link" href="Contact.html">Contact US</a>


            <div class="cart-icon" onclick="goToCart()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cartCount">0LE</span>
          </div>

          <button class="signin-btn" onclick="goToLogin()">Sign In</button>

          <script>
            function goToLogin() {
              window.location.href = "login.html";
            }
          </script>
        </div>
      </header>
    <div class="checkout-container">
      <!-- LEFT -->
      <div class="checkout-left">
        <h2>Customer Info</h2>

        <form id="checkoutForm">
          <input type="text" placeholder="Name" required />
          <input type="text" placeholder="Phone" required />
          <input type="text" placeholder="Address" required />

          <button type="submit" id="confirmBtn">Confirm Order</button>
        </form>
      </div>

      <!-- RIGHT -->
      <div class="checkout-right">
        <h2>Order Summary</h2>
        <div id="summaryItems"></div>

        <hr />

        <p>Subtotal: <span id="subtotal"></span></p>
        <p>Delivery: <span id="delivery"></span></p>
        <h3>Total: <span id="total"></span></h3>
      </div>
    </div>

    <!-- PAYMENT MODAL -->
   <div id="paymentModal" class="modal">
  <div class="modal-box">

    <span class="close-x" onclick="closeModal()">✕</span>

    <div class="modal-header">
      <div class="icon-circle">
        <i class="fa-solid fa-credit-card"></i>
      </div>
      <h2>Payment Method</h2>
      <p>Choose your preferred payment option</p>
    </div>

    <div class="methods">

   <div class="method" onclick="selectMethod(this,'cash')">
  <div class="left">
  <img src="/image/cash on delivery.jpg" width="60">
    <div>
      <h4>Cash on Delivery</h4>
      <span>Pay with cash upon delivery</span>
    </div>
  </div>
  <i class="fa-solid fa-chevron-right"></i>
</div>

     <div class="method" onclick="selectMethod(this,'card')">
  <div class="left">
   <img src="/image/Credit Card.png" width="80">
    <div>
      <h4>Credit Card</h4>
      <span>Pay securely with your card</span>
    </div>
  </div>
  <i class="fa-solid fa-chevron-right"></i>
</div>

  <div class="method active" onclick="selectMethod(this,'vodafone')">
  <div class="left">
    <img src="image/vodafone.jpg" width="60">
    <div>
      <h4>Vodafone Cash</h4>
      <span>Pay using Vodafone Cash</span>
    </div>
   
  </div>
   <i class="fa-solid fa-chevron-right"></i>
</div>

    <div id="paymentForm"></div>

    <button class="confirm-btn">Confirm Payment</button>

    <div class="divider">or</div>

    <button class="cancel" onclick="closeModal()">✖ Cancel</button>

  </div>
</div>

    <script>
      // ================= CART =================
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      let selectedMethod = "";

      // ================= RENDER =================
      function renderSummary() {
        let container = document.getElementById("summaryItems");
        container.innerHTML = "";

        let subtotal = 0;

        cart.forEach((item, index) => {
          let total = item.price * item.qty;
          subtotal += total;
container.innerHTML += `
  <div class="order-item">

    <div style="display:flex; gap:10px; align-items:center;">

      <img src="${item.img}" 
           style="width:50px;height:50px;border-radius:8px;object-fit:cover;" />

      <div>
        <div>${item.name}</div>
        <small>Qty: ${item.qty}</small>
      </div>

    </div>

    <span>${total} LE</span>

  </div>
`;
    
        });

        let delivery = subtotal > 0 ? 80 : 0;
        let final = subtotal + delivery;

        document.getElementById("subtotal").innerText = subtotal + " LE";
        document.getElementById("delivery").innerText = delivery + " LE";
        document.getElementById("total").innerText = final + " LE";
      }

      // ================= PAYMENT STEP 1 =================
      document
        .getElementById("checkoutForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          if (cart.length === 0) {
            alert("Cart is empty ❌");
            return;
          }

          document.getElementById("paymentModal").style.display = "flex";
        });

      // ================= SELECT METHOD =================
   function selectMethod(element, method){

  selectedMethod = method;

  // remove active
  document.querySelectorAll(".method").forEach(m => m.classList.remove("active"));

  // add active
  element.classList.add("active");

  let form = document.getElementById("paymentForm");

  if(method === "vodafone"){
    form.innerHTML = `
      <input type="text" placeholder="Vodafone Cash Number">
      <input type="text" placeholder="Transfer Code">
    `;
  }

  else if(method === "card"){
    form.innerHTML = `
      <input type="text" placeholder="Card Number">
      <input type="text" placeholder="Name on Card">
      <input type="text" placeholder="Expiry Date">
      <input type="text" placeholder="CVV">
    `;
  }

  else{
    form.innerHTML = "";
  }
}
    // ================= PAY =================
      function pay() {
        let btn = document.getElementById("confirmBtn");
        btn.innerText = "Processing...";
        btn.disabled = true;

        setTimeout(() => {
          alert("Order placed using: " + selectedMethod);

          localStorage.removeItem("cart");
          cart = [];

          updateCartCount();

          window.location.href = "index.html";
        }, 1000);
      }

      // ================= CLOSE MODAL =================
      function closeModal() {
        document.getElementById("paymentModal").style.display = "none";
        document.getElementById("paymentForm").innerHTML = "";
        selectedMethod = "";
      }

      // ================= CART COUNT =================
      function updateCartCount() {
        let total = 0;
        cart.forEach((i) => (total += i.qty));
        document.getElementById("cartCount").innerText = total;
      }

      // ================= INIT =================
      renderSummary();
      updateCartCount();

         function goToCart() {
        window.location.href = "cart.html";
      }
    </script>
  </body>
</html>
